<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>糊涂蛋工作台</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="糊涂蛋工作台">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- 启动图：打开网页时先显示，加载完自动淡出 -->
  <div id="splash">
    <div class="splash-box">
      <img src="assets/icons/icon-192.png" alt="" class="splash-icon">
      <h1>糊涂蛋工作台</h1>
      <p>正在唤醒你的工作台…</p>
      <div class="splash-spinner"></div>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar"></aside>
    <main id="main">
      <header id="topbar"></header>
      <section id="content"></section>
    </main>
  </div>

  <!-- 口令弹窗：第一次打开要输入你的口令，所有设备用同一个口令才看得到同一份数据 -->
  <div id="passModal" class="modal-mask">
    <div class="modal-box">
      <h2>🔐 输入工作台口令</h2>
      <p>同一口令 = 同一份数据 · 忘了解不开，请牢记</p>
      <input id="passInput" type="password" placeholder="输入你的口令" autocomplete="off">
      <button id="passOk">进入工作台</button>
      <div id="passWarn" class="pass-warn" style="display:none;">
        <p class="pass-warn-text">这个口令对应的工作台是空的，可能输错了口令。</p>
        <button id="passForce" class="btn-primary">仍要进入（清空后重开）</button>
        <button id="passRetry" class="btn-ghost">重新输入</button>
      </div>
    </div>
  </div>

  <!-- Supabase 官方 JS（同步用，已配置才生效；没网时应用仍可用本地缓存） -->
  <script src="assets/js/lib/supabase-js.global.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/crypto.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/sections.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
