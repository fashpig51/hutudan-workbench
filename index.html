<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>糊涂蛋工作台</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <main id="main">
      <header id="topbar"></header>
      <section id="content"></section>
    </main>
  </div>

  <!-- 口令弹窗：第一次打开要输入你的口令，所有设备用同一个口令才看得到同一份数据 -->
  <div id="passModal" class="modal-mask">
    <div class="modal-box">
      <h2>🔐 输入工作台口令</h2>
      <p>这是你自己的口令（不用注册账号）。<br>同一口令的设备共享同一份数据；忘了口令=数据解不开，请牢记。</p>
      <input id="passInput" type="password" placeholder="设一个只有你知的口令" autocomplete="off">
      <button id="passOk">进入工作台</button>
    </div>
  </div>

  <!-- Supabase 官方 JS（同步用，已配置才生效；没网时应用仍可用本地缓存） -->
  <script src="assets/js/lib/supabase-js.global.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/crypto.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/sections.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
